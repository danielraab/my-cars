name: CI

on:
  push:
    branches:
      - master
    tags: ["*"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# The detector runs first so the expensive jobs below only receive a runner when
# a changed path can affect them. A CI-workflow change deliberately selects all
# jobs, ensuring its own behaviour is exercised on the pull request.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Tag pushes publish a release and must always run the full suite; a new
    # tag ref also has no meaningful "before" commit to diff against.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # PRs compare their head to the PR base; pushes compare only this
          # commit to the immediately preceding pushed commit.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'openapi/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - 'redocly.yaml'
              - '.github/workflows/ci.yml'
            i18n:
              - 'frontend/src/i18n/**'
              - 'frontend/scripts/i18n-coverage.mjs'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - 'backend/**'
              - 'frontend/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'

  # Independent jobs rather than one: a failure names itself from the job
  # alone, and the fast checks do not queue behind the slow image build.
  backend:
    name: Backend
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Matches docker-compose.yml's db service: same image, same credentials.
    # Migration and connection-pool tests (internal/db) need a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mycars
          POSTGRES_PASSWORD: mycars
          POSTGRES_DB: mycars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycars -d mycars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mycars:mycars@localhost:5432/mycars?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod so CI cannot drift from the module.
          go-version-file: backend/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend
    needs: changes
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # Node 26 no longer bundles Corepack (nodejs/node#57617), so install it
      # from npm before enabling it. The Dockerfile does the same thing for the
      # same reason — keep the two in step.
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      # The pnpm version comes from package.json's packageManager field, so
      # this resolves to the same pnpm the image build uses. --frozen-lockfile
      # makes a stale lockfile a failure rather than a silent rewrite.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:api
      - run: pnpm lint:openapi
      - run: pnpm build

  # Reports per-locale translation coverage against en (the source of truth,
  # see frontend/AGENTS.md). Informational only: continue-on-error keeps a
  # shortfall from failing the workflow, and nothing depends on this job.
  # The PR comment is shown only while some locale is short of 100%; a stale
  # comment is removed once resolved.
  i18n-coverage:
    name: i18n coverage
    needs: changes
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # Exits 1 on a shortfall on purpose (a local run fails visibly), so the
      # follow-up steps need `always()` or they would be skipped.
      - name: Compute translation coverage
        id: coverage
        run: node frontend/scripts/i18n-coverage.mjs

      - name: Comment on PR
        if: always() && steps.coverage.outputs.has_shortfall == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- i18n-coverage-report -->";
            const body = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/i18n-coverage-report.md`,
              "utf8",
            );
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Remove stale PR comment
        if: always() && steps.coverage.outputs.has_shortfall == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- i18n-coverage-report -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

  # Builds what actually ships, frontend and backend together, without
  # pushing it anywhere. It repeats work the jobs above do, and it is the
  # only job that proves the published artifact still builds.
  image:
    name: Image
    needs: changes
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}

  # Builds and publishes the image to GHCR. Only runs for a pushed git tag,
  # which becomes the image tag (and `latest`).
  publish:
    name: Publish image
    needs: [backend, frontend]
    # The implicit success() on a plain `if` checks the whole transitive
    # chain, including `changes`, which is deliberately skipped on tags.
    # Without `always()` that skip would skip publish too.
    if: >-
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: version
        run: |
          IMAGE_PATH="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}
            ${{ steps.version.outputs.image }}:latest
