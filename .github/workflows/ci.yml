name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# The detector runs first so the expensive jobs below only receive a runner when
# a changed path can affect them. A CI-workflow change deliberately selects all
# jobs, ensuring its own behaviour is exercised on the pull request.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - 'redocly.yaml'
              - '.github/workflows/ci.yml'
            image:
              - 'Dockerfile'
              - 'backend/**'
              - 'frontend/**'
              - 'openapi/**'
              - '.github/workflows/ci.yml'

  # Three independent jobs rather than one: a failure names itself from the job
  # alone, and the fast checks do not queue behind the slow image build.
  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Matches docker-compose.yml's db service: same image, same credentials.
    # Migration and connection-pool tests (internal/db) need a real database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mycars
          POSTGRES_PASSWORD: mycars
          POSTGRES_DB: mycars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mycars -d mycars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mycars:mycars@localhost:5432/mycars?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod so CI cannot drift from the module.
          go-version-file: backend/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # Node 26 no longer bundles Corepack (nodejs/node#57617), so install it
      # from npm before enabling it. The Dockerfile does the same thing for the
      # same reason — keep the two in step.
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      # The pnpm version comes from package.json's packageManager field, so
      # this resolves to the same pnpm the image build uses. --frozen-lockfile
      # makes a stale lockfile a failure rather than a silent rewrite.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm lint:openapi
      - run: pnpm build

  image:
    name: Image
    needs: changes
    if: ${{ needs.changes.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Builds what actually ships, frontend and backend together. It repeats
      # work the jobs above do, and it is the only job that proves the
      # published artifact still builds.
      - name: Build the application image
        run: docker build .
